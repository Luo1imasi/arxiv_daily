webdav:
  url: "https://your-webdav-server.example/dav"
  username: ""
  password: ""
  path: "/papers/"
  local_path: ""

zotero:
  api_key: ""
  user_id: ""
  collection_key: ""

source:
  arxiv:
    use_keyword_search: true
    max_keywords: 15
    llm_prefilter_limit: 200
    recent_days: 7
    max_recent_days: 30
    recency_half_life_days: 7
    lookback_score_threshold: 7.0

llm:
  api_key: ""
  base_url: "http://127.0.0.1:8080/v1"
  model: "grok-4.5"
  models:
    extract: "grok-4.5"
    coarse: "grok-4.3"
    summarize: "grok-4.5"
    judge: "grok-4.7"
    profile: "grok-4.7"
    qa: "grok-4.5"
  language: "Chinese"
  max_concurrent_requests: 2
  coarse_batch_size: 40
  coarse_concurrency: 2
  coarse_abstract_chars: 280
  coarse_max_tokens: 2200

reranker:
  mmr_lambda: 0.78

executor:
  manifest_ttl_minutes: 30
  retriever_workers: 4

server:
  host: "0.0.0.0"
  port: 5555
  admin_password: "admin"
