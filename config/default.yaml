webdav:
  url: ""
  username: ""
  password: ""
  path: "/papers/"
  local_path: ""

source:
  arxiv:
    category: ["cs.AI", "cs.CV", "cs.LG", "cs.CL", "cs.RO", "cs.SY"]
    include_cross_list: false
    use_keyword_search: false
    max_keywords: 10
    keyword_corpus_limit: 300
    keyword_max_doc_freq: 0.6
    candidate_cache_ttl_minutes: 180
    keyword_fallback_min_results: 20
    keyword_query_max_groups: 3
    keyword_query_group_size: 6
    keyword_query_max_chars: 1100
    keyword_query_max_results: 80
    semantic_mix: 0.45
    semantic_prefilter_limit: 300
    llm_prefilter_limit: 200
    # Core hits are kept first. Broad-only hits may fill the rest, but the
    # whole prefilter list never grows past this cap.
    broad_backfill_limit: 100
    author_overlap_weight: 0.6
    category_preference_weight: 0.8
    pre_rerank_limit: 120
    use_bm25_scoring: true
    min_keyword_matches: 1
    recent_days: 14
    max_recent_days: 140
    recent_max_results: 2000
    # Historical announcement backfill. One category query per subject, paged
    # in small requests so a single call stays inside arXiv's polite limits.
    announcement_page_size: 50
    announcement_category_max_results: 100
    announcement_max_attempts: 5
    recency_half_life_days: 14
    lookback_score_threshold: 7.0

llm:
  api_key: ""
  base_url: "https://api.openai.com/v1"
  model: "gpt-4o-mini"
  models:
    extract: "gpt-4o-mini"
    summarize: "gpt-4o-mini"
    judge: "gpt-4o-mini"
    profile: "gpt-4o-mini"
    qa: "gpt-4o-mini"
    coarse: "gpt-4o-mini"
  language: "Chinese"
  timeout: 180.0
  max_retries: 3
  base_delay: 1.0
  max_concurrent_requests: 2
  coarse_batch_size: 40
  coarse_concurrency: 2
  coarse_abstract_chars: 280
  coarse_max_tokens: 2200
  coarse_duplicate_jaccard: 0.8

reranker:
  model: "jinaai/jina-embeddings-v5-text-nano"
  top_k: 20
  score_batch_size: 256
  relevance_weight: 0.7
  novelty_weight: 0.15
  recency_weight: 0.15
  retrieval_weight: 0.2
  pre_mmr_candidate_factor: 4
  mmr_lambda: 0.78
  recency_half_life_days: 7.0
  encode_kwargs:
    task: "retrieval"
    prompt_name: "document"

executor:
  max_paper_num: 20
  source: ["arxiv"]
  timezone: "Asia/Shanghai"
  schedule_hour: 8
  schedule_minute: 0
  manifest_ttl_minutes: 30
  retriever_workers: 2
  corpus_workers: 4
  llm_workers: 2
  thread_pool_workers: 8
  judge_pool_size: 24
  arxiv_id_batch_size: 50

server:
  host: "0.0.0.0"
  port: 5555
  admin_password: "admin"
